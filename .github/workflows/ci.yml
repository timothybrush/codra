name: Code Quality

on:
  workflow_dispatch:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Stability
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codra_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codra_test
      GITHUB_APP_SLUG: codra-test-app
      GITHUB_APP_WEBHOOK_SECRET: fake-webhook-secret
      GITHUB_CLIENT_ID: fake-dashboard-client-id
      GITHUB_CLIENT_SECRET: fake-dashboard-client-secret
      AUTH_CALLBACK_URL: https://codra.test/auth/github/callback
      APP_URL: https://codra.test
      DASHBOARD_ALLOWED_USERS: devarshishimpi
      BOT_USERNAME: codra-test-app
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis (Typecheck)
        run: npm run typecheck

      # Lint is not cosmetic here: eslint.config.js carries the barrel guards that stop a module from
      # importing a mocked barrel's sibling (which would silently void a vi.mock), plus max-lines and
      # import-x/no-cycle. Without this step those guards only ever ran on a developer's machine.
      - name: Static Analysis (Lint)
        run: npm run lint

      - name: Automated Tests
        run: npm test

      # Catches bundler-level breakage typecheck cannot see -- notably a client file pulling zod into
      # the browser bundle through @shared/schema. `vite build` rather than `npm run build` so CI does
      # not depend on the `wrangler types` step, which only regenerates a local .d.ts.
      - name: Build (client bundle)
        run: npx vite build
